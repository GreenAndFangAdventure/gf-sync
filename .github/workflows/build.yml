# Build GF Sync on GitHub-hosted Windows runners.
# The repository root is the GF Sync project (go.mod, build.ps1, installer/).
#
# - Every push / pull request: go test, build GFSync.exe and the installer,
#   upload them as a workflow artifact.
# - Tag v*: additionally create a DRAFT GitHub Release with the files and
#   SHA256SUMS.txt. The owner reviews and publishes it by hand.
# - Code signing (SignPath Foundation) is prepared below but commented out
#   until the application is approved. See CODE_SIGNING_POLICY.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $v = $env:REF_NAME.TrimStart("v")
            if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "tag must look like v1.2.3: $env:REF_NAME" }
          } else {
            $v = "0.0.0-ci.$env:RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $iscc) { choco install innosetup --yes --no-progress }

      - name: Test
        run: go test ./...

      - name: Build GFSync.exe
        run: ./build.ps1 -Version "${{ steps.version.outputs.version }}" -SkipTests -SkipInstaller

      # ---- SignPath: sign GFSync.exe (enable after approval) -------------------
      # Needs repository secret SIGNPATH_API_TOKEN and the IDs from SignPath.
      # Every signing request is approved manually by an Approver in SignPath.
      #
      # - name: Upload unsigned exe
      #   id: unsigned-exe
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: unsigned-exe
      #     path: dist/GFSync.exe
      #
      # - name: Sign GFSync.exe
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<SignPath organization id>"
      #     project-slug: "gf-sync"
      #     signing-policy-slug: "release-signing"
      #     artifact-configuration-slug: "exe"
      #     github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist
      # ---------------------------------------------------------------------------

      - name: Build installer
        run: ./build.ps1 -Version "${{ steps.version.outputs.version }}" -SkipBuild

      # ---- SignPath: sign GFSync-Setup-*.exe (enable after approval) ----------
      # - name: Upload unsigned installer
      #   id: unsigned-setup
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: unsigned-setup
      #     path: dist/GFSync-Setup-*.exe
      #
      # - name: Sign installer
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<SignPath organization id>"
      #     project-slug: "gf-sync"
      #     signing-policy-slug: "release-signing"
      #     artifact-configuration-slug: "setup"
      #     github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist
      #
      # - name: Recompute SHA-256 after signing
      #   run: |
      #     Get-ChildItem dist/GFSync.exe, dist/GFSync-Setup-*.exe | ForEach-Object {
      #       "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_).Hash.ToLower(), $_.Name
      #     } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      # ---------------------------------------------------------------------------

      - name: Show SHA-256
        run: Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gfsync-${{ steps.version.outputs.version }}
          path: |
            dist/GFSync.exe
            dist/GFSync-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "GF Sync $TAG" \
            --notes "請核對 SHA256SUMS.txt。這個版本尚未經過程式碼簽章（見 CODE_SIGNING_POLICY.md）。"
